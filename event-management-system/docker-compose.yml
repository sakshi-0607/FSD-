services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: eventhub-backend
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_ORIGIN=*
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: eventhub-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
