services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: eventhub-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_ORIGIN=http://localhost:80
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=1d
    env_file:
      - ./server/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_SOCKET_URL=http://localhost:5000
    container_name: eventhub-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

